name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # release.yml calls this same workflow as its gate, so the release is held to
  # exactly the checks master is held to — one definition, no drift between
  # "what CI runs" and "what a release had to pass".
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit-ish to check out. Empty (push/pull_request) keeps actions/checkout's
          default, which is the commit that triggered the run. release.yml passes the
          release tag, so the gate reads the same bytes the installer is built from.
        required: false
        type: string
        default: ''

# Third-party actions are pinned to a full commit SHA (not a moving tag) so a
# compromised or retagged upstream release can't silently run in our CI with
# secrets in scope. The trailing comment records the human-readable version.
# To bump: resolve the new tag to its SHA (`gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`).
jobs:
  lint-and-build:
    runs-on: ubuntu-22.04
    env:
      # Vitest exercises the browser updater's public release lookup.
      VITE_GITHUB_REPO: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Empty on push/pull_request (checkout falls back to the triggering
          # commit); the release tag when release.yml calls this workflow.
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # AS-10. Der Audit-Befund war nicht "es gibt Lint-Fehler", sondern
      # "Lint ist kein Gate": seit April stand hier `continue-on-error: true`,
      # und ein Schritt, der nicht scheitern kann, misst nichts. Die Schuld
      # dahinter ist jetzt bezahlt — `eslint .` meldet ueber 1080 Dateien
      # 0 Fehler und 0 Warnungen, und zwar OHNE neue `eslint-disable`: die
      # Regeln stehen scharf, der Code hat sich bewegt.
      #
      # Zwei Dinge mussten dafuer zusammenkommen, und beide sind nachgemessen:
      # (1) KF-11 — ein gebautes `src-tauri/target` schleuste generiertes
      #     JavaScript in die Pruefung und machte das Ergebnis davon abhaengig,
      #     OB jemand vorher gebaut hatte. Ohne den `globalIgnores`-Eintrag
      #     waere dieses Gate auf jeder Maschine mit Release-Build rot und auf
      #     einem frischen Klon gruen — schlimmer als ein Plattformunterschied,
      #     weil es sich auf derselben Maschine aendert. Gegengeprueft: auf
      #     einer Maschine MIT Release-Build (87 Codegen-Assets im Baum) meldet
      #     `npm run lint` weiterhin 0.
      # (2) Die letzten 45 Meldungen aus `src/components` sind gefallen, nicht
      #     stillgestellt.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Audit W-T2: der Baum stand auf 11 Importzyklen, alle mit derselben
      # Bauart — eine Kante, die es nicht geben durfte, versteckt hinter einem
      # `await import()` mitten in einer Funktion. Sichtbar wird so etwas nur,
      # wenn jemand misst; also misst CI. Gating ab dem ersten Tag, weil der
      # Stand bei null anfängt und es hier folglich keine Altlast zu bezahlen
      # gibt (anders als bei lint und clippy weiter unten).
      - name: Import cycles
        run: npm run cycles

      # AUFLAGE a (review-isalinux.md Runde 2): the K1 ISA guard's own
      # decision logic (scripts/lib/isa-guard-linux-rules.sh) had zero CI
      # coverage -- it only ever ran once, by hand, on the Bauer's Mac. This
      # needs no build, no ELF file and no objdump (it proves the pure
      # classification/ceiling functions against checked-in fixture text,
      # scripts/__fixtures__/linux-isa/*.disasm.txt), so it runs here on
      # every commit, on the plain ubuntu-22.04 runner this job already
      # has, well before the real per-platform run in release.yml.
      - name: K1 ISA guard selftest (Linux decision logic)
        run: bash scripts/verify-sidecar-isa.selftest.sh

      - name: Unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Empty on push/pull_request (checkout falls back to the triggering
          # commit); the release tag when release.yml calls this workflow.
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The harness stubs the Tauri IPC in-page (e2e/support/tauri-mock.ts) —
      # no Rust sidecar, Ollama or ComfyUI processes needed.
      - name: Playwright e2e (Tauri-mocked)
        run: npm run test:e2e

  cargo-check:
    runs-on: ${{ matrix.platform }}
    strategy:
      # E5: without this, one platform's failure cancels the other lane
      # before it reports anything, so a run that broke on BOTH platforms
      # only ever shows the first one found, the 3.0.0 release night cost
      # five rounds finding the second failure only after fixing the first.
      # Same rationale as tauri-build below, vorbild for this line.
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Empty on push/pull_request (checkout falls back to the triggering
          # commit); the release tag when release.yml calls this workflow.
          ref: ${{ inputs.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      # tauri-build's copy_binaries HARD-FAILS from build.rs when a declared
      # externalBin file is missing — cargo check needs the sidecar file to
      # EXIST, not to work. Stub it so the check doesn't pay a 20-min llama
      # build; the real binaries are built in release.yml + sidecar-windows.yml.
      #
      # The same empty file is enough for `cargo test` and `cargo clippy`: they
      # run the identical build.rs, and no test executes the sidecar. The few
      # tests that need a live inference server are already #[ignore]d for
      # exactly that reason (see commands/remote.rs, commands/install.rs).
      - name: Stub llama-server sidecar for cargo check
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          triple="$(rustc -vV | awk '/^host:/{print $2}')"
          case "$triple" in
            *-windows-*) touch "src-tauri/bin/lazarus-llama-server-$triple.exe" ;;
            *)           touch "src-tauri/bin/lazarus-llama-server-$triple" ;;
          esac
          ls -la src-tauri/bin/
          # K1 (3.0.1): tauri.windows.conf.json / tauri.linux.conf.json now
          # declare a bundle.resources glob for the dynamic-ISA companion
          # libraries (src-tauri/resources/llama/<triple>/*), and the comment
          # below already established that build.rs resolves bundle.resources
          # during a plain `cargo check`, not only a full `tauri build`. A
          # glob with zero matches would make that resolution fail here too,
          # so this stub needs a companion file to match, the same reasoning
          # as the exe stub above, just for the resources side of the bundle
          # instead of externalBin.
          case "$triple" in
            *-windows-*) mkdir -p "src-tauri/resources/llama/$triple" && touch "src-tauri/resources/llama/$triple/ggml-cpu-x64.dll" ;;
            *-linux-*)   mkdir -p "src-tauri/resources/llama/$triple" && touch "src-tauri/resources/llama/$triple/ggml-cpu-x64.so" ;;
          esac

      # tauri-build also resolves bundle.resources, and ../dist only exists
      # after a frontend build. This job runs no npm at all, so build.rs bailed
      # with "resource path `../dist` doesn't exist" before it ever reached the
      # crate. A placeholder is enough: nothing here loads the bundle, it only
      # has to be a directory that exists.
      - name: Stub the frontend bundle for build.rs
        shell: bash
        run: |
          mkdir -p dist
          printf '<!doctype html><title>ci placeholder</title>' > dist/index.html

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      # 539 Rust tests lived in the tree while CI only ever type-checked them.
      # They are unit tests over pure logic and short-lived child processes —
      # the whole suite runs in seconds once the crate is built, so there is no
      # cost argument for leaving them out.
      #
      # mlx_snapshot.rs's seven set_len tests allocate real bytes on NTFS
      # (9.18 GB per test), unlike on the other platforms where a sparse file
      # costs nothing. cargo test's default runner is one thread per core;
      # windows-latest has 4 vCPUs, so the parallel default would peak around
      # 35 GB (four tests at 9.18 GB) against the 15 to 30 GB a windows-latest
      # runner has free. Linux keeps the parallel default; only the Windows
      # lane is forced single-threaded, which caps the same tests at 9.18 GB.
      # Split into two steps, one per platform, so this stays a literal
      # `run: cargo test` on the non-Windows lane for tooling that greps
      # the workflow file for that exact line.
      - name: Cargo test
        if: matrix.platform != 'windows-latest'
        working-directory: src-tauri
        run: cargo test

      - name: Cargo test (Windows, one thread)
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        run: cargo test -- --test-threads=1

      # Runde 3, Nachbesserung 7: the self-heal tests in install/pip.rs
      # (a_ssl_collision_is_retried_once_..., a_genuine_ssl_gap_is_not_
      # retried_forever) are #[ignore]d, documented in
      # install/children.rs:148-167 - INSTALLER_CHILDREN is a process-wide
      # registry, and any AppState drop anywhere in the SAME test binary
      # SIGKILLs every registered pid, not just its own. That is real under
      # `cargo test`'s default parallel runner, so the tests skip there
      # rather than flake. Without this step, though, the plain `cargo
      # test` above never ran them at all: the self-heal behaviour from
      # Punkt 11, the actual fix for the customer's ticket, had no gate.
      # `--test-threads=1` removes the exact hazard the tests are ignored
      # for, so this step runs them for real.
      #
      # Named by filter, NOT a blanket `-- --ignored`: this crate's other
      # #[ignore]d tests are live/e2e checks that need something this
      # runner does not have (pep668_e2e_live_detect_and_create_venv wants
      # LAZARUS_PEP668_TEST_PYTHON pointed at a fake interpreter on disk;
      # commands::proxy's live_strict_aiohttp test wants a local stub
      # server on 127.0.0.1:18899). Running the whole ignored set here
      # would turn CI red for a setup problem, not a regression. Two
      # substring filters are OR'd by the test harness, so both self-heal
      # tests run and nothing else ignored does.
      #
      # Runde 4 (review-engine.md Runde 3, Abschnitt 5): a filter that
      # matches ZERO tests is not an error to libtest, it prints "0 passed"
      # and exits 0. Both tests are `#[cfg(not(windows))]`, so on
      # windows-latest this step always ran nothing and stayed silently
      # green, including in a future where both tests are renamed or
      # deleted outright, exactly the case this gate exists to catch. Two
      # fixes: skip the step on Windows instead of pretending to run it
      # there, and on the platform where it actually matters, grep the
      # test harness's own summary line for "2 passed" so a filter that
      # stops matching (a rename, a deletion) fails the step instead of
      # quietly running nothing.
      - name: Cargo test (ignored self-heal tests, serial)
        if: runner.os != 'Windows'
        working-directory: src-tauri
        shell: bash
        run: |
          out="$(cargo test -- --ignored --test-threads=1 ssl_collision_is_retried_once genuine_ssl_gap_is_not_retried_forever 2>&1)"
          echo "$out"
          echo "$out" | grep -Eq '^test result: ok\. 2 passed; 0 failed;' || {
            echo "::error::expected exactly 2 passed self-heal tests, the filter matched a different count (renamed or deleted test?)"
            exit 1
          }

      # Runde 6, F15 (review Runde 6, Abschnitt 7): the B9 real-venv proof
      # (`a_rebuilt_venvs_scripts_point_at_the_final_path_not_a_staging_name`,
      # install/venv.rs) is `#[ignore]`d for the same INSTALLER_CHILDREN
      # reason as the self-heal tests above, and it never had a CI gate at
      # all, only a note in the review that someone ran it by hand once. That
      # means the actual proof that a rebuilt venv's `bin/pip` names the
      # final path instead of a vanished staging folder could regress
      # silently, exactly the shape of the bug it exists to catch. Same
      # pattern as the self-heal step: named by filter, serial, and the
      # summary line is grep'd for the exact passed count so a rename or
      # deletion turns this step red instead of leaving it quietly green on
      # "0 passed". Linux only: it needs a real `python3` on the runner (the
      # test itself skips gracefully without one, but that would make the
      # count check ambiguous between "skipped" and "ran"), and this is the
      # platform review-engine.md's Beweisliste actually exercises it on.
      - name: Cargo test (ignored B9 real venv proof, serial)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        shell: bash
        run: |
          out="$(cargo test -- --ignored --test-threads=1 a_rebuilt_venvs_scripts_point_at_the_final_path_not_a_staging_name 2>&1)"
          echo "$out"
          echo "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || {
            echo "::error::expected exactly 1 passed B9 real-venv test, the filter matched a different count (renamed or deleted test?)"
            exit 1
          }

      # Gating since 01.09.2026 — the debt this comment used to describe is paid.
      # The deny-by-default error sat at src/commands/secret.rs:173, not :108 as
      # the old note said: MAX_UNITS was a `usize` using `usize::MAX` to mean
      # "no limit", which made `count() <= MAX_UNITS` always true. It is an
      # `Option<usize>` now, so "no limit" is `None` and the comparison is gone.
      # The 78 warning sites behind it are at 0. Eleven `allow`s remain, each on
      # a single item with its reason written next to it; there is no
      # crate-level `#![allow]`.
      #
      # NOTE for the ubuntu lane: that 0 was measured on macOS, and the
      # dead-code half of the list is platform-conditional by nature. A Linux
      # runner can surface items a macOS run cannot see. If this job goes red on
      # arrival, that is the likely reason — and the fix is the same kind of
      # single-item annotation with a reason, never a blanket allow.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # ── Is the product still buildable at all? ───────────────────────────────
  #
  # Audit M6, and the hole underneath it. Until this job existed, no workflow
  # ever ran `tauri build`. CI ran `npm run build` (vite), `cargo check` and
  # `cargo test` — all three pass happily on a configuration that cannot be
  # bundled — and the single place `tauri build` did run was release.yml, with
  # TAURI_SIGNING_PRIVATE_KEY supplied from secrets. So the one lane able to
  # see a bundling failure was the one lane configured never to hit it.
  #
  # What that hid, at 10bfa0d7 (v2.6.7), in the shipped product: with
  # `bundle.createUpdaterArtifacts` set next to `plugins.updater.pubkey`,
  # `tauri build` wrote the installers to disk and THEN exited 1 with "A public
  # key has been found, but no private key". Anyone without the release
  # secret — a contributor, a fork, an AGPL-3.0 §6 recipient — could not build
  # the product. Measured on Windows and reproduced on macOS; fixed in
  # a0030ad2 by dropping that one field.
  #
  # This job builds with NO signing key, deliberately, and the script unsets
  # the two signing variables itself. Rationale in scripts/ci-tauri-build.sh:
  # a gate that consumes a secret goes quietly green in a fork where the secret
  # is absent, and — measured locally — handing the broken 10bfa0d7 config a
  # key makes it exit 0, so a key-carrying gate would have been green on the
  # exact commit it exists to fail. No secret is read here, so a fork is held
  # to precisely this check with nothing to configure.
  #
  # The step has no `continue-on-error` and the script does not pipe the exit
  # code away (PIPESTATUS[0], not `tee`'s status). A build that leaves
  # installers on disk and still exits non-zero fails this job — which is the
  # exact shape of the defect above.
  tauri-build:
    runs-on: ${{ matrix.platform }}
    # A hung bundler must fail loudly rather than burn the 6-hour job ceiling,
    # the way the Linux lane did on 2026-08-15 (see release.yml).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The platforms this product actually ships, read off release.yml's
        # build-tauri matrix — there is no macOS lane (dropped in c1644d9a).
        # release-build-gate.test.ts compares the two lists on every run, so
        # re-adding a release platform without covering it here fails a test
        # instead of silently narrowing this gate.
        platform: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Empty on push/pull_request (checkout falls back to the triggering
          # commit); the release tag when release.yml calls this workflow.
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      # Same stub as the cargo-check job above, for the same reason:
      # tauri-build's copy_binaries hard-fails on a missing externalBin, and a
      # real llama.cpp build costs ~20 min that this gate does not need — it is
      # asking whether the app bundles, not whether inference works. The real
      # binaries are built in release.yml and sidecar-windows.yml.
      #
      # Measured 2026-09-01 on macOS: a zero-byte stub survives the full
      # `tauri build`, ad-hoc codesigning of the sidecar included (exit 0, .app
      # + .dmg produced). macOS is the strictest of the three here — Linux and
      # Windows do not sign the sidecar at all — but this has NOT been observed
      # on the two runner platforms, because no Actions run was permitted.
      - name: Stub llama-server sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          triple="$(rustc -vV | awk '/^host:/{print $2}')"
          case "$triple" in
            *-windows-*) touch "src-tauri/bin/lazarus-llama-server-$triple.exe" ;;
            *)           touch "src-tauri/bin/lazarus-llama-server-$triple" ;;
          esac
          ls -la src-tauri/bin/
          # K1 (3.0.1): this job runs a REAL `tauri build`, which resolves
          # bundle.resources for real: tauri.windows.conf.json /
          # tauri.linux.conf.json now glob src-tauri/resources/llama/<triple>/*
          # for the dynamic-ISA companion libraries, and this gate never runs
          # scripts/build-llama.sh to produce them. Same stub reasoning as the
          # exe above, on the resources side of the bundle instead of
          # externalBin, so a glob with zero matches cannot fail this gate for
          # a reason that has nothing to do with what it is checking.
          case "$triple" in
            *-windows-*) mkdir -p "src-tauri/resources/llama/$triple" && touch "src-tauri/resources/llama/$triple/ggml-cpu-x64.dll" ;;
            *-linux-*)   mkdir -p "src-tauri/resources/llama/$triple" && touch "src-tauri/resources/llama/$triple/ggml-cpu-x64.so" ;;
          esac

      - name: Install npm dependencies
        run: npm ci

      # No `continue-on-error`, no `|| true`, no `if: secrets…` — see the
      # header. Deliberately the last word on whether this commit is shippable.
      - name: Tauri build (unsigned — exit code is the verdict)
        shell: bash
        run: |
          # K1-18 (lu-301/e2e/linux/BERICHT.md): release.yml's real, non-stub
          # Linux build measured that linuxdeploy resolves lazarus-llama-server's
          # NEEDED entries via the standard ld search path, not via the
          # staged usr/lib/.../llama/ location, and fails without
          # LD_LIBRARY_PATH pointed at it. This job stubs the sidecar as a
          # zero-byte file (see "Stub llama-server sidecar" above), so
          # whether linuxdeploy hits the identical failure here was NOT
          # independently measured on that stub; this only mirrors the
          # release-lane fix defensively, for the same reason, so this gate
          # and the real release build cannot silently diverge on it. Empty
          # on windows-latest, where LD_LIBRARY_PATH is meaningless.
          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            triple="$(rustc -vV | awk '/^host:/{print $2}')"
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/src-tauri/resources/llama/$triple${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          bash scripts/ci-tauri-build.sh
